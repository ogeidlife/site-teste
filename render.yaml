# Deploy automático a partir do GitHub (Render → New → Blueprint → escolha este repositório).
# Disco persistente é obrigatório (banco SQLite + uploads) e costuma exigir plano pago: confira o plano no Render.
services:
  - type: web
    name: ogeid-site
    runtime: node
    plan: starter
    buildCommand: echo "sem build"
    startCommand: node --no-warnings server.js
    healthCheckPath: /
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DATA_DIR, value: /var/data }
      - { key: SITE_URL, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
    disk:
      name: ogeid-data
      mountPath: /var/data
      sizeGB: 5

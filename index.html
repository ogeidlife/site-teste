<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OGEID — Game Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Archivo:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0a0b0c; --bg-1: #131417; --border: #2a2c31;
      --text: #e9e9e6; --text-muted: #8a8d93; --accent: #ff3d7f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg-0); color: var(--text);
      font-family: 'Archivo', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { max-width: 560px; padding: 32px; text-align: center; }
    h1 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 56px; font-weight: 800; margin: 0 0 4px; letter-spacing: 1px;
    }
    .sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: var(--accent); margin-bottom: 32px; }
    p { color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block; text-decoration: none; color: var(--text);
      background: var(--bg-1); border: 1px solid var(--border); border-radius: 4px;
      padding: 14px 22px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
      letter-spacing: 1px; transition: border-color 0.15s ease;
    }
    a.btn:hover { border-color: var(--accent); }
    a.btn.primary { background: var(--accent); border-color: var(--accent); color: #150008; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OGEID</h1>
    <div class="sub">GRAFFITI GAME — PROJECT ROOT</div>
    <p>
      Jogo 3D de graffiti urbano/noturno construído com uma engine própria em
      Three.js. Use o Configurador para montar o mapa, importar seus modelos
      GLB e configurar o jogo. O modo de jogo (Play Mode) chega nas próximas fases.
    </p>
    <div class="links">
      <a class="btn primary" href="configurador.html">ABRIR CONFIGURADOR</a>
      <a class="btn" href="game.html">ABRIR JOGO (preview)</a>
    </div>
  </div>
</body>
</html>

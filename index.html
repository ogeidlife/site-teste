<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161c;
    --panel:#1c222b;
    --panel-edge:#2a323e;
    --paper:#ece6d6;
    --paper-dim:#ddd6c2;
    --ink:#ece7dd;
    --muted:#8a93a0;
    --accent:#d98a3d;
    --accent-deep:#a85a2a;
    --danger:#c1543a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    letter-spacing:.01em;
  }

  /* ---------- gate ---------- */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:360px;
    background:var(--paper);
    color:#1c222b;
    padding:40px 32px;
    position:relative;
  }
  .gate-card::before{
    content:"";
    position:absolute;
    top:10px; left:10px; right:-10px; bottom:-10px;
    border:1px solid var(--panel-edge);
    z-index:-1;
  }
  .gate-title{
    font-size:28px;
    margin:0 0 6px;
  }
  .gate-sub{
    font-size:13px;
    color:#5c6570;
    margin:0 0 28px;
    line-height:1.5;
  }
  .field-label{
    display:block;
    font-size:11px;
    color:#5c6570;
    margin-bottom:6px;
  }
  #senha{
    width:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    padding:11px 12px;
    border:1px solid #c9c0a8;
    background:#f7f4ea;
    color:#1c222b;
    outline:none;
  }
  #senha:focus{border-color:var(--accent-deep);}
  .gate-btn{
    margin-top:16px;
    width:100%;
    padding:12px;
    background:var(--accent);
    color:#1c1712;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .gate-btn:hover{background:var(--accent-deep); color:var(--paper);}
  .gate-btn:disabled{opacity:.6; cursor:default;}
  .gate-err{
    margin-top:14px;
    font-size:12.5px;
    color:var(--danger);
    min-height:16px;
  }

  /* ---------- app ---------- */
  #app{display:none;}
  .app-shell{
    max-width:760px;
    margin:0 auto;
    padding:48px 20px 80px;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--panel-edge);
    padding-bottom:18px;
    margin-bottom:32px;
  }
  .topbar h1{
    font-size:26px;
    margin:0;
    font-weight:500;
  }
  .signout{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .signout:hover{color:var(--ink);}

  .dropzone{
    border:1px dashed var(--panel-edge);
    padding:28px 20px;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent);
    background:#1a2028;
  }
  .dropzone p{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .dropzone strong{color:var(--ink); font-weight:500;}
  #fileInput{display:none;}

  .uploads{margin-top:14px;}
  .upload-row{
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    padding:6px 2px;
    border-bottom:1px solid var(--panel-edge);
  }
  .upload-bar{
    height:2px;
    background:var(--panel-edge);
    margin-top:4px;
  }
  .upload-bar-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .2s;
  }

  .list-head{
    display:flex;
    font-size:11px;
    color:var(--muted);
    padding:22px 4px 8px;
    border-bottom:1px solid var(--panel-edge);
  }
  .list-head span:nth-child(1){flex:1;}
  .list-head span:nth-child(2){width:80px;}
  .list-head span:nth-child(3){width:90px;}
  .list-head span:nth-child(4){width:70px; text-align:right;}

  .file-row{
    display:flex;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--panel-edge);
    font-size:13px;
  }
  .file-row:hover{background:#171c23;}
  .file-name{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding-right:10px;
  }
  .file-size{width:80px; color:var(--muted); font-size:12px;}
  .file-date{width:90px; color:var(--muted); font-size:12px;}
  .file-actions{
    width:70px;
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .file-actions button{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    padding:2px;
  }
  .file-actions button:hover{color:var(--ink);}
  .file-actions .del:hover{color:var(--danger);}

  .empty{
    padding:40px 4px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <p class="wordmark gate-title">Cofre</p>
      <p class="gate-sub">Arquivos da equipe. Digite a senha de acesso para entrar.</p>
      <label class="field-label" for="senha">senha</label>
      <input id="senha" type="password" autocomplete="current-password" />
      <button class="gate-btn" id="entrarBtn">Entrar</button>
      <p class="gate-err" id="gateErr"></p>
    </div>
  </div>

  <div id="app">
    <div class="app-shell">
      <div class="topbar">
        <h1 class="wordmark">Cofre</h1>
        <button class="signout" id="sairBtn">sair</button>
      </div>

      <div class="dropzone" id="dropzone">
        <p><strong>Arraste arquivos aqui</strong> ou clique para escolher.</p>
      </div>
      <input type="file" id="fileInput" multiple />
      <div class="uploads" id="uploads"></div>

      <div class="list-head">
        <span>arquivo</span><span>tamanho</span><span>enviado</span><span>ações</span>
      </div>
      <div id="fileList"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const storage = firebase.storage();
    const filesRef = storage.ref('arquivos');

    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const senhaInput = document.getElementById('senha');
    const entrarBtn = document.getElementById('entrarBtn');
    const gateErr = document.getElementById('gateErr');
    const sairBtn = document.getElementById('sairBtn');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadsEl = document.getElementById('uploads');
    const fileListEl = document.getElementById('fileList');

    function fmtSize(bytes){
      if (bytes < 1024) return bytes + ' b';
      if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' kb';
      return (bytes/1024/1024).toFixed(1) + ' mb';
    }
    function fmtDate(iso){
      const d = new Date(iso);
      const hoje = new Date();
      const mesmoDia = d.toDateString() === hoje.toDateString();
      if (mesmoDia) return 'hoje';
      const ontem = new Date(hoje); ontem.setDate(hoje.getDate()-1);
      if (d.toDateString() === ontem.toDateString()) return 'ontem';
      return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
    }

    // ---- login ----
    entrarBtn.addEventListener('click', fazerLogin);
    senhaInput.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

    function fazerLogin(){
      const senha = senhaInput.value;
      if (!senha) return;
      entrarBtn.disabled = true;
      entrarBtn.textContent = 'Entrando...';
      gateErr.textContent = '';
      auth.signInWithEmailAndPassword(TEAM_EMAIL, senha)
        .catch(() => {
          gateErr.textContent = 'Senha incorreta.';
          entrarBtn.disabled = false;
          entrarBtn.textContent = 'Entrar';
        });
    }

    sairBtn.addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(user => {
      if (user){
        gate.style.display = 'none';
        app.style.display = 'block';
        carregarArquivos();
      } else {
        gate.style.display = 'flex';
        app.style.display = 'none';
        entrarBtn.disabled = false;
        entrarBtn.textContent = 'Entrar';
        senhaInput.value = '';
      }
    });

    // ---- upload ----
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('drag');
      enviarArquivos(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => enviarArquivos(fileInput.files));

    function enviarArquivos(fileListRaw){
      Array.from(fileListRaw).forEach(file => {
        const row = document.createElement('div');
        row.className = 'upload-row';
        row.innerHTML = `<span>${file.name}</span><span class="pct">0%</span>`;
        const bar = document.createElement('div');
        bar.className = 'upload-bar';
        bar.innerHTML = '<div class="upload-bar-fill"></div>';
        row.appendChild(bar);
        uploadsEl.appendChild(row);

        const task = filesRef.child(file.name).put(file);
        task.on('state_changed', snap => {
          const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          row.querySelector('.pct').textContent = pct + '%';
          row.querySelector('.upload-bar-fill').style.width = pct + '%';
        }, () => {
          row.querySelector('.pct').textContent = 'erro';
        }, () => {
          row.remove();
          carregarArquivos();
        });
      });
    }

    // ---- listagem ----
    async function carregarArquivos(){
      fileListEl.innerHTML = '<div class="empty">Carregando...</div>';
      const res = await filesRef.listAll();
      if (res.items.length === 0){
        fileListEl.innerHTML = '<div class="empty">Nenhum arquivo ainda. Envie o primeiro acima.</div>';
        return;
      }
      const itens = await Promise.all(res.items.map(async item => {
        const meta = await item.getMetadata();
        const url = await item.getDownloadURL();
        return { name: item.name, size: meta.size, created: meta.timeCreated, url, ref: item };
      }));
      itens.sort((a,b) => new Date(b.created) - new Date(a.created));

      fileListEl.innerHTML = '';
      itens.forEach(it => {
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `
          <span class="file-name">${it.name}</span>
          <span class="file-size">${fmtSize(it.size)}</span>
          <span class="file-date">${fmtDate(it.created)}</span>
          <span class="file-actions">
            <button class="baixar" title="Baixar">⬇</button>
            <button class="del" title="Excluir">✕</button>
          </span>`;
        row.querySelector('.baixar').addEventListener('click', () => window.open(it.url, '_blank'));
        row.querySelector('.del').addEventListener('click', async () => {
          if (!confirm(`Excluir "${it.name}"?`)) return;
          await it.ref.delete();
          carregarArquivos();
        });
        fileListEl.appendChild(row);
      });
    }
  </script>
</body>
</html>
